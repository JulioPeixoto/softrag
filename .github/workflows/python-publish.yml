name: Publish

on:
  push:
    branches: [master] # every commit on master goes to TestPyPI
    tags: ["v*"] # a vX.Y.Z tag goes to PyPI
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build wheel and sdist
        run: uv build --out-dir dist

      - name: Verify the wheel imports and is complete
        # Publishing a wheel that cannot be imported is the one failure worth
        # spending a job on, and it is invisible to a source-tree test run.
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install --quiet dist/*.whl
          /tmp/verify/bin/python -c "
          import softrag, importlib.resources as r
          print('version', softrag.__version__)
          assert softrag.Rag and softrag.connect and softrag.AsyncRag
          assert (r.files('softrag') / 'py.typed').is_file(), 'py.typed missing from the wheel'
          import softrag.cli, softrag.eval, softrag.rerank, softrag.transforms
          print('wheel OK')
          "

      - name: Check package metadata
        run: |
          python -m pip install --quiet twine
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: python-package-dists
          path: dist/

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    # The repository's default branch is master. This condition used to name
    # main, so the job never ran.
    if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/softrag/
    permissions:
      id-token: write # OIDC, for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-dists
          path: dist/

      - name: Upload to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          # A rebuilt master commit reuses a version TestPyPI already has;
          # that is expected, not a failure.
          skip-existing: true
          verbose: true

  publish-pypi:
    name: Publish to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/softrag/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-dists
          path: dist/

      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          verbose: true
