[project]
name = "softrag"
version = "0.2.0"
description = "The embedded RAG engine: hybrid retrieval in a single SQLite file, no server required"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Julio Peixoto" }]
keywords = [
    "rag",
    "retrieval-augmented-generation",
    "sqlite",
    "sqlite-vec",
    "vector-search",
    "hybrid-search",
    "bm25",
    "embeddings",
    "local-first",
    "llm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
    "Typing :: Typed",
]

# The core install is deliberately one dependency. Everything else is an extra,
# so `pip install softrag` stays fast and a local-only deployment pulls no
# network clients at all.
dependencies = ["sqlite-vec>=0.1.6"]

[project.optional-dependencies]
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.40"]
local = ["sentence-transformers>=3.0"]
rerank = ["sentence-transformers>=3.0"]
cohere = ["cohere>=5.0"]
files = ["pypdf>=5.0"]
web = ["httpx>=0.27", "trafilatura>=2.0"]
cli = ["rich>=13.0"]
all = [
    "openai>=1.40",
    "anthropic>=0.40",
    "sentence-transformers>=3.0",
    "pypdf>=5.0",
    "httpx>=0.27",
    "trafilatura>=2.0",
    "rich>=13.0",
]

[project.scripts]
softrag = "softrag.cli:main"

[project.urls]
Homepage = "https://github.com/JulioPeixoto/softrag"
Documentation = "https://github.com/JulioPeixoto/softrag#readme"
Issues = "https://github.com/JulioPeixoto/softrag/issues"
Changelog = "https://github.com/JulioPeixoto/softrag/blob/master/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/softrag"]

[tool.hatch.build.targets.sdist]
include = ["src/softrag", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: tests that take more than a second",
    "network: tests that need network access",
    "optional: tests that need an optional dependency",
]
filterwarnings = ["error::DeprecationWarning:softrag.*"]

[tool.ruff]
line-length = 90
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",   # line length is handled by the formatter
    "B008",   # function calls in argument defaults are fine for our dataclasses
    "SIM108", # ternaries are not always clearer
    "RUF022", # __all__ is grouped by role, which reads better than alphabetical
    "SIM905", # the stopword lists are prose a human edits, not literals
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.10"
files = ["src/softrag"]
ignore_missing_imports = true
warn_unused_ignores = false
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[tool.coverage.run]
source = ["src/softrag"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]
